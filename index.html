<!DOCTYPE html>

<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Anh Kỳ ❤️</title>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    overflow:hidden;

    background:#000;

    font-family:Arial,Helvetica,sans-serif;

}

canvas{

    position:fixed;

    top:0;

    left:0;

    z-index:0;

}

.container{

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:white;

    z-index:2;

    width:90%;

}

h1{

    color:#ffe600;

    font-size:60px;

}

h2{

    color:white;

    margin-top:10px;

    font-size:34px;

}

.gallery{

    display:flex;

    justify-content:center;

    gap:20px;

    margin:30px 0;

    flex-wrap:wrap;

}

.gallery img{

    width:220px;

    max-width:42vw;

    border-radius:18px;

    border:4px solid white;

    box-shadow:0 0 20px rgba(255,255,255,.4);

}

.message{

    font-size:22px;

    line-height:1.8;

    max-width:800px;

    margin:auto;

}
    </style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="container" id="container">

<h1>🎂 Happy Birthday</h1>

<h2>Anh Kỳ ❤️</h2>

<div class="gallery">

<img src="1785338581788_2008560692812646716_3963308102167263971_325fc97805e8757bc900f706721e195a.jpg" alt="Ảnh 1">

<img src="1785338581814_2008560692812646716_3963308102167263971_d210f1b37d41fa6c4060c94c670799de.jpg" alt="Ảnh 2">

</div>

<div class="message">

Chúc cậu luôn vui vẻ, ngày càng xinh đẹp và luôn mỉm cười mỗi ngày. ❤️<br><br>

Hy vọng mọi điều tốt đẹp nhất sẽ đến với cậu, luôn mạnh khỏe, bình an và đạt được tất cả những điều mình mong muốn.<br><br>

🎉 Happy Birthday Anh Kỳ! 🎂

</div>

</div>

<script>
    const canvas = document.getElementById("matrix");

const ctx = canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = window.innerWidth;

    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", () => {

    resizeCanvas();

    columns = Math.floor(canvas.width / fontSize);

    drops = Array(columns).fill(1);

});

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ❤";

const fontSize = 16;

let columns = Math.floor(canvas.width / fontSize);

let drops = Array(columns).fill(1);

function draw(){

    ctx.fillStyle = "rgba(0,0,0,0.08)";

    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff66";

    ctx.font = fontSize + "px monospace";

    for(let i=0;i<drops.length;i++){

        const text = letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){

            drops[i]=0;

        }

        drops[i]++;

    }

}

setInterval(draw,35);
    
</script>

</body>
</html>
